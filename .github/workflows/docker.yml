name: Build Grafana image

on:
  push:
    branches: [main]
    paths:
      - "central/compose.yml"
      - "central/compose.build.yml"
      - "central/grafana/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

env:
  DOCKER_IMAGE: nguyenduc1603/central-logging

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./central/grafana
          push: true
          build-args: |
            GRAFANA_IMAGE=grafana/grafana:13.1.0
            VICTORIALOGS_PLUGIN_VERSION=0.27.1
          tags: |
            ${{ env.DOCKER_IMAGE }}:grafana-latest
            ${{ env.DOCKER_IMAGE }}:grafana-v${{ github.run_number }}
